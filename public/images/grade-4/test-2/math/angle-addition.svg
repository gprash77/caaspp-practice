<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" role="img" aria-labelledby="title desc">
  <title id="title">Adjacent angles totaling 145 degrees</title>
  <desc id="desc">Rays OA, OB, and OC form adjacent angles. Angle AOB is 68 degrees and angle AOC is 145 degrees. Angle BOC is unknown.</desc>
  <rect width="700" height="320" fill="white"/>
  <g stroke="#17243a" stroke-width="6" fill="none" stroke-linecap="round"><path d="M330 245 L610 245"/><path d="M330 245 L215 90"/><path d="M330 245 L95 190"/></g>
  <g font-family="Arial,sans-serif" font-size="25" fill="#17243a"><text x="320" y="280">O</text><text x="618" y="253">C</text><text x="195" y="80">B</text><text x="65" y="190">A</text><text x="342" y="175">68°</text><text x="205" y="215">145° total</text></g>
</svg>
