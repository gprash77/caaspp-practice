<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-labelledby="title desc">
  <title id="title">Angle measuring 112 degrees</title>
  <desc id="desc">Two rays meet at vertex B. One ray points right and the other points up and left. The inside angle is labeled 112 degrees.</desc>
  <rect width="620" height="300" fill="white"/>
  <g stroke="#17243a" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M300 220 L540 220"/><path d="M300 220 L180 70"/>
    <path d="M370 220 A70 70 0 0 0 256 165" stroke="#1976d2" stroke-width="4"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="25" fill="#17243a"><text x="292" y="255">B</text><text x="548" y="228">C</text><text x="155" y="62">A</text><text x="330" y="160">112°</text></g>
</svg>
