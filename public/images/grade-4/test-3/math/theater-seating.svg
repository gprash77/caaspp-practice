<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">Community theater seating sections</title><desc id="desc">A stage is above three labeled seating sections. Orchestra has 8 rows of 24 seats, Center has 6 rows of 18 seats, and Balcony has 5 rows of 16 seats. Two aisles separate the sections.</desc>
  <rect width="820" height="470" fill="#fff"/><rect x="90" y="25" width="640" height="70" rx="10" fill="#244f73"/><text x="410" y="69" fill="#fff" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">STAGE</text><g stroke="#174c73" stroke-width="4"><rect x="45" y="130" width="280" height="275" fill="#dcecf8"/><rect x="355" y="130" width="210" height="275" fill="#f9e4b7"/><rect x="595" y="130" width="180" height="275" fill="#dfead2"/></g><g font-family="Arial" text-anchor="middle" fill="#183b5b"><text x="185" y="185" font-size="27" font-weight="700">Orchestra</text><text x="185" y="225" font-size="23">8 rows × 24 seats</text><text x="460" y="185" font-size="27" font-weight="700">Center</text><text x="460" y="225" font-size="23">6 rows × 18 seats</text><text x="685" y="185" font-size="27" font-weight="700">Balcony</text><text x="685" y="225" font-size="23">5 rows × 16 seats</text><text x="340" y="445" font-size="20">aisle</text><text x="580" y="445" font-size="20">aisle</text></g>
</svg>
